name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Static export
        run: bunx next build
        env:
          STATIC_EXPORT: '1'
          NEXT_PUBLIC_BASE_PATH: /daali-register
          NEXT_DIST_DIR: .next-static
      - name: Copy static site to ./public_out
        run: mkdir -p public_out && cp -r .next-static/. public_out/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public_out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
